# vim:ft=kitty

background_opacity 0.8
window_padding_width 5

# Tab bar
# Put the tab bar (the strip listing tabs/windows) at the top instead of
# kitty's default bottom edge.
tab_bar_edge top

# Term
# Left at the default xterm-kitty. Remotes get the terminfo pushed once via the
# kitty-terminfo helper in ~/.zshrc.
# Uncomment to go back to the lowest-common-denominator TERM.
# term xterm-256color

# BEGIN_CURSOR
cursor_shape beam
cursor_beam_thickness 1.0
cursor_trail 5
cursor_trail_decay 0.1 0.5

hide_window_decorations yes

# END_CURSOR\
    
# BEGIN_KITTY_FONTS
font_family      family="CodeNewRoman Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 15.0
# END_KITTY_FONTS\


# BEGIN_KITTY_THEME
# Ayu
include current-theme.conf
# END_KITTY_THEME
