set -g mouse on
set -g set-clipboard on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Pane splitting: '-' splits down, 'v' splits right
# (default '"' and '%' bindings are kept)
bind - split-window -v
bind v split-window -h

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'seebi/tmux-colors-solarized'
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'erikw/tmux-dark-notify'

# minimal-tmux-status: window list on left, date+time on right
set -g @minimal-tmux-indicator false
set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-status-right "%Y-%m-%d %H:%M"

# tmux-dark-notify: auto switch light/dark using solarized themes
set -g @dark-notify-theme-path-light '$HOME/.tmux/plugins/tmux-colors-solarized/tmuxcolors-light.conf'
set -g @dark-notify-theme-path-dark '$HOME/.tmux/plugins/tmux-colors-solarized/tmuxcolors-dark.conf'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
